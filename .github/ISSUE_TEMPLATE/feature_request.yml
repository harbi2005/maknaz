name: طلب ميزة / Feature request
description: وظيفة جديدة أو تعديل على سلوك موثق
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        قبل الفتح: تحقق أن الطلب داخل نطاق النسخة الأولى في `docs/00-product/MVP_SCOPE.md`. ما هو خارج النطاق يُرفع كـ `decision-needed`.
  - type: input
    id: task
    attributes:
      label: معرف المهمة
      description: من TEAM_RESPONSIBILITIES إن وجد (مثل SE-014)
      placeholder: SE-014
  - type: textarea
    id: problem
    attributes:
      label: المشكلة أو الحاجة
      description: ما الذي لا يمكن للمستخدم فعله الآن؟ ومن المستخدم (منجم، مصنع، ناقل، إدارة)؟
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: السلوك المطلوب
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: المراجع
      description: FR / BR / UC / US / AC
      placeholder: FR-071, BR-034, UC-010
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: معايير القبول
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: الأولوية (MoSCoW)
      options: ["Must", "Should", "Could"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: التخصص المالك
      options: ["Engineering (SE)", "Design (UX)", "Data (DA)", "Business (BD)", "QA", "Leadership (TL)"]
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: تأكيدات
      options:
        - label: الطلب لا يتضمن ذكاء اصطناعي أو تحليلًا كيميائيًا أو حكمًا بصلاحية المواد أو دفعًا حقيقيًا
          required: true
        - label: لا يتضمن مواعيد نهائية
          required: true
