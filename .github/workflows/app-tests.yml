# Application checks (ADR-016): typecheck, unit + integration tests on real PostgreSQL 16, web build.
# No deploy step: deployment requires explicit approval.
name: app-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maknaz
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: maknaz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maknaz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_SECRET_KEY: ci-only-secret-key-not-used-elsewhere
      DATABASE_URL: postgresql://maknaz:ci-only-password@localhost:5432/maknaz_test
      TEST_DATABASE_URL: postgresql://maknaz:ci-only-password@localhost:5432/maknaz_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
        working-directory: apps/web
